[project]
name = "agentic-blog-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Varun Fatepuria", email = "fatepuria.varun@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-cli[inmem]>=0.4.33",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
agentic-blog-generator = "agentic_blog_generator:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
